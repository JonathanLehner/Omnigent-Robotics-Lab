# Rung 3: physical handle grasp with a world-z release lift. The open jaws
# rise clear of the placed block before any horizontal retreat.
name: v3_grasp_lift
rung: 3
idealizations:
  - oracle_structure_spec
  - oracle_build_order
  - oracle_block_pose
  - fixed_base
  - scripted_arm
arm_block_collision: true
stages:
  perceive: oracle
  plan_order: oracle
  build: scripted_real_grasp
params:
  segment_s: 2.5
  place_clearance_m: 0.008
  carry_height_m: 0.15
  grasp_tip_offset_m: [0.015, 0.005, 0.01]
  handle_friction: [1.0, 0.01, 0.001]
  grasp_close_command: -0.5
  grasp_close_dwell_s: 1.0
  release_dwell_s: 0.5
  # Joint-space tracking realizes about 87% of the Cartesian waypoint delta.
  # This margin yields >=0.12 m measured world-z lift before lateral retreat.
  release_vertical_lift_m: 0.15
  release_vertical_lift_steps: 12
  release_phase_settle_s: 5.0
  min_transport_m: 0.08
  max_relative_slip_m: 0.04
  max_pre_release_error_m: 0.05
  handle_collision_displacement_m: 0.02
