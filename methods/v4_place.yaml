# Rung 4: preserve v0's oracle spec/order and weld grasp, but measure the
# pre-release block position and iteratively correct the gripper target.
name: v4_place
rung: 4
idealizations:
  - oracle_structure_spec
  - oracle_build_order
  - oracle_block_pose
  - fixed_base
  - weld_grasp
  - no_arm_block_collision
arm_block_collision: false
stages:
  perceive: oracle
  plan_order: oracle
  build: closed_loop_weld_place
params:
  segment_s: 1.0
  place_clearance_m: 0.005
  carry_height_m: 0.15
  place_correction_passes: 2
  place_correction_segment_s: 0.6
  place_correction_dwell_s: 0.2
  place_correction_tolerance_m: 0.001
  place_correction_max_step_m: 0.04
