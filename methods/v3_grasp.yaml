# Rung 3: a physical Spot gripper pinch on the block handle. The block is
# carried only by MuJoCo contact/friction; the weld-grasp API is never used.
name: v3_grasp
rung: 3
idealizations:
  - oracle_structure_spec
  - oracle_build_order
  - oracle_block_pose
  - fixed_base
  - scripted_arm
arm_block_collision: true
max_workers: 6
stages:
  perceive: oracle
  plan_order: oracle
  build: scripted_real_grasp
params:
  segment_s: 2.5
  place_clearance_m: 0.008
  carry_height_m: 0.15
  grasp_tip_offset_m: [0.015, 0.005, 0.01]
  handle_friction: [1.0, 0.01, 0.001]
  grasp_close_command: -0.5
  grasp_close_dwell_s: 1.0
  release_dwell_s: 0.5
  min_transport_m: 0.08
  max_relative_slip_m: 0.04
  max_pre_release_error_m: 0.05
  handle_collision_displacement_m: 0.02
