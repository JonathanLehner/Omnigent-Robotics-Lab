spec_version: 1
name: assembly_lab_pi
description: >-
  PI of the Omnigent Robotics Lab. Delegates a simulation-first robotics research goal (Spot builds a structure
  from a picture) to eight specialist agents, chooses between competing proposals, and records decisions that
  cite reviewed results in the shared research record.
instructions: AGENTS.md

executor:
  type: omnigent
  config:
    harness: claude-sdk

async: true
cancellable: true

tools:
  agents:
    - literature_scout
    - scene_designer
    - method_designer
    - experiment_planner
    - robotics_engineer
    - experiment_runner
    - analyst
    - reviewer
  lab:
    type: mcp
    command: uv
    args: [run, --quiet, --project, "${LAB_ROOT}", python, -m, lab.server]
    tools: [query_record, get_object, record_decision, list_equipment, budget_status, list_scenes, list_methods]

guardrails:
  ask_timeout: 86400  # human approvals may take a while
  policies:
    session_budget:
      type: function
      handler: omnigent.policies.builtins.cost.cost_budget
      factory_params:
        max_cost_usd: 40.0
        ask_thresholds_usd: [15.0, 30.0]
    tool_call_cap:
      type: function
      handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
      factory_params:
        limit: 600
    protect_heldout_set:
      type: function
      handler: lab.policies.protect_heldout_set
    decisions_cite_results:
      type: function
      handler: lab.policies.pi_cites_results
